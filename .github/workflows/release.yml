# Builds Toolbay for macOS (Apple Silicon + Intel) and Windows and publishes a draft GitHub
# Release with installers and latest.json for the in-app updater.
# Run it by pushing a tag like v0.1.1, or from the Actions tab.
#
# Secrets (Settings > Secrets and variables > Actions). Same names as toolbay-flow, so one set
# works for both repos; signing switches on by itself once they exist.
#   Optional: auto-update for the hub itself
#     TAURI_SIGNING_PRIVATE_KEY            contents of ~/.tauri/toolbay-updater.key (update signatures)
#     TAURI_SIGNING_PRIVATE_KEY_PASSWORD   empty unless the key has one
#     Without it, installers still build and sign; the release just has no latest.json.
#   macOS: Developer ID signing + notarization (Apple Developer Program; steps in docs/SIGNING.md)
#     APPLE_CERTIFICATE            base64 of a .p12 with the "Developer ID Application" AND the
#                                  "Developer ID Installer" certificates (the second signs the .pkg)
#     APPLE_CERTIFICATE_PASSWORD   password of that .p12
#     APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD (app-specific password)
#     APPLE_SIGNING_IDENTITY       optional; defaults to "Developer ID Application"
#   Windows: Azure Artifact Signing (formerly Trusted Signing)
#     AZURE_CLIENT_ID, AZURE_CLIENT_SECRET, AZURE_TENANT_ID, TRUSTED_SIGNING_ACCOUNT, TRUSTED_SIGNING_PROFILE
# Without the Apple secrets every Mac build is still ad-hoc signed with the hardened runtime
# (signingIdentity "-" in tauri.conf.json), so Gatekeeper offers "Open Anyway" instead of
# calling the app damaged.
name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}
    env:
      TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
      TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target
      - run: npm ci
      # Without the updater key, still build and sign the installers; just skip the
      # auto-update files (installed copies then update from the next keyed release).
      - name: Updater signing (if configured)
        shell: bash
        run: |
          if [ -z "$TAURI_SIGNING_PRIVATE_KEY" ]; then
            echo "No updater key: building installers without auto-update files"
            node -e "const f='src-tauri/tauri.conf.json';const j=require('./'+f);j.bundle.createUpdaterArtifacts=false;require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
            echo "INCLUDE_UPDATER_JSON=false" >> "$GITHUB_ENV"
          else
            echo "INCLUDE_UPDATER_JSON=true" >> "$GITHUB_ENV"
          fi
      - run: cargo test --manifest-path src-tauri/Cargo.toml
        if: matrix.platform == 'windows-latest'

      - name: Apple Developer ID signing and notarization (if configured)
        if: matrix.platform == 'macos-latest'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          if [ -n "$APPLE_CERTIFICATE" ]; then
            echo "Developer ID signing: on"
            echo "APPLE_CERTIFICATE=$APPLE_CERTIFICATE" >> "$GITHUB_ENV"
            echo "APPLE_CERTIFICATE_PASSWORD=$APPLE_CERTIFICATE_PASSWORD" >> "$GITHUB_ENV"
            echo "APPLE_SIGNING_IDENTITY=${APPLE_SIGNING_IDENTITY:-Developer ID Application}" >> "$GITHUB_ENV"
            if [ -n "$APPLE_ID" ] && [ -n "$APPLE_TEAM_ID" ]; then
              echo "Notarization: on"
              echo "APPLE_ID=$APPLE_ID" >> "$GITHUB_ENV"
              echo "APPLE_PASSWORD=${APPLE_APP_PASSWORD:-$APPLE_PASSWORD}" >> "$GITHUB_ENV"
              echo "APPLE_TEAM_ID=$APPLE_TEAM_ID" >> "$GITHUB_ENV"
            fi
          else
            echo "No Apple certificate yet: ad-hoc signing only"
          fi

      - name: Windows signing (if configured)
        if: matrix.platform == 'windows-latest'
        shell: bash
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          TRUSTED_SIGNING_ACCOUNT: ${{ secrets.TRUSTED_SIGNING_ACCOUNT }}
          TRUSTED_SIGNING_PROFILE: ${{ secrets.TRUSTED_SIGNING_PROFILE }}
        run: |
          if [ -n "$TRUSTED_SIGNING_ACCOUNT" ]; then
            cargo install trusted-signing-cli --locked
            for v in AZURE_CLIENT_ID AZURE_CLIENT_SECRET AZURE_TENANT_ID; do echo "$v=${!v}" >> "$GITHUB_ENV"; done
            node -e "const f='src-tauri/tauri.conf.json';const j=require('./'+f);j.bundle.windows.signCommand='trusted-signing-cli -e https://eus.codesigning.azure.net -a $TRUSTED_SIGNING_ACCOUNT -c $TRUSTED_SIGNING_PROFILE -d Toolbay %1';require('fs').writeFileSync(f,JSON.stringify(j,null,2))"
          else
            echo "No Windows signing secrets yet: unsigned installer"
          fi

      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_type == 'tag' && github.ref_name || 'v__VERSION__' }}
          releaseName: Toolbay v__VERSION__
          releaseDraft: true
          includeUpdaterJson: ${{ env.INCLUDE_UPDATER_JSON == 'true' }}
          args: ${{ matrix.args }}

      # Fail the release if the Mac app, or the app inside the DMG, isn't properly sealed.
      - name: Verify macOS signature
        if: matrix.platform == 'macos-latest'
        shell: bash
        run: |
          set -euo pipefail
          triple=${{ contains(matrix.args, 'aarch64') && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}
          bundle=src-tauri/target/$triple/release/bundle
          app=$(ls -d "$bundle"/macos/*.app | head -1)
          codesign --verify --deep --strict --verbose=2 "$app"
          codesign -d --entitlements :- "$app" | grep -q automation.apple-events
          codesign -d --verbose=4 "$app" 2>&1 | grep -E "^(Authority|Signature|TeamIdentifier|Runtime|flags)" || true
          dmg=$(ls "$bundle"/dmg/*.dmg | head -1)
          mnt=$(hdiutil attach -nobrowse -readonly "$dmg" | tail -1 | awk -F'\t' '{print $NF}')
          codesign --verify --deep --strict --verbose=2 "$mnt"/*.app
          hdiutil detach "$mnt"
          if [ -n "${APPLE_ID:-}" ]; then
            spctl --assess --type execute --verbose=4 "$app"
            xcrun stapler validate "$app"
          fi

      # A tool installed by the hub must open without any Gatekeeper prompt: the hub downloads with
      # its own HTTP client (nothing is quarantined) and clears the flag after installing anyway.
      # Runs the hub's real install path headless (models skipped) and opens Toolbay Notes.
      - name: Install a tool through the hub (no Gatekeeper prompt)
        if: matrix.platform == 'macos-latest' && contains(matrix.args, 'aarch64')
        shell: bash
        timeout-minutes: 10
        run: |
          set -uo pipefail
          app=$(ls -d src-tauri/target/aarch64-apple-darwin/release/bundle/macos/*.app | head -1)
          bin="$app/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Contents/Info.plist")"
          TOOLBAY_CI_GITHUB_TOKEN="${{ secrets.GITHUB_TOKEN }}" TOOLBAY_CI_INSTALL="cereal sriptcollector/cereal" TOOLBAY_CI_SKIP_FILES=1             TOOLBAY_CI_RESULT="$PWD/ci-result.txt" "$bin" || true
          echo "Result: $(cat ci-result.txt 2>/dev/null || echo 'no result')"
          ls -la@ /Applications/Toolbay ~/Applications/Toolbay 2>/dev/null || true
          for a in /Applications/Toolbay/*.app ~/Applications/Toolbay/*.app; do
            [ -d "$a" ] || continue
            xattr -p com.apple.quarantine "$a" 2>/dev/null && { echo "$a is quarantined"; exit 1; }
            echo "$a: not quarantined"; codesign -dv "$a" 2>&1 | grep -E "Signature|Authority|TeamIdentifier" || true
          done
          test "$(cat ci-result.txt 2>/dev/null)" = ok

      # Mac installer package. Without an Apple certificate, a downloaded ad-hoc DMG app is called
      # "damaged"; an unsigned .pkg only gets "unidentified developer / Open Anyway", and the app the
      # macOS Installer puts in /Applications isn't quarantined, so it opens normally afterwards.
      - name: macOS installer package
        if: matrix.platform == 'macos-latest' && github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          APPLE_INSTALLER_IDENTITY: ${{ secrets.APPLE_INSTALLER_IDENTITY }}
        run: |
          set -euo pipefail
          triple=${{ contains(matrix.args, 'aarch64') && 'aarch64-apple-darwin' || 'x86_64-apple-darwin' }}
          arch=${{ contains(matrix.args, 'aarch64') && 'aarch64' || 'x64' }}
          ver=${GITHUB_REF_NAME#v}
          app=$(ls -d src-tauri/target/$triple/release/bundle/macos/*.app | head -1)
          chmod +x scripts/macos-pkg/postinstall
          out="Toolbay_${ver}_${arch}.pkg"
          # Signing the .pkg needs a "Developer ID Installer" certificate. Export it into the same .p12
          # as the Developer ID Application one (APPLE_CERTIFICATE) and it's found automatically.
          sign=(); inst=""
          if [ -n "${APPLE_CERTIFICATE:-}" ]; then
            kc="$RUNNER_TEMP/pkg.keychain-db"
            security create-keychain -p pkg "$kc"; security set-keychain-settings "$kc"; security unlock-keychain -p pkg "$kc"
            echo "$APPLE_CERTIFICATE" | base64 --decode > "$RUNNER_TEMP/cert.p12"
            security import "$RUNNER_TEMP/cert.p12" -k "$kc" -P "${APPLE_CERTIFICATE_PASSWORD:-}" -T /usr/bin/pkgbuild -T /usr/bin/productsign
            rm -f "$RUNNER_TEMP/cert.p12"
            security list-keychains -d user -s "$kc" $(security list-keychains -d user | tr -d '"')
            inst="${APPLE_INSTALLER_IDENTITY:-$(security find-identity -v "$kc" | grep -o '"Developer ID Installer[^"]*"' | head -1 | tr -d '"')}"
            if [ -n "$inst" ]; then sign=(--sign "$inst" --keychain "$kc"); echo "Signing the .pkg as: $inst"
            else echo "::warning::No Developer ID Installer certificate in APPLE_CERTIFICATE, so the .pkg is unsigned and macOS will warn"; fi
          fi
          # Fixed location: never "relocate" the install onto an old copy elsewhere.
          root=$(mktemp -d); cp -R "$app" "$root/"
          pkgbuild --analyze --root "$root" comp.plist
          plutil -replace 0.BundleIsRelocatable -bool NO comp.plist
          pkgbuild --root "$root" --component-plist comp.plist --install-location /Applications             --identifier ai.toolbay.desktop.pkg --version "$ver" --scripts scripts/macos-pkg ${sign[@]+"${sign[@]}"} "$out"
          # Notarize and staple the signed .pkg so it opens with no warning, even offline.
          notarized=""
          if [ -n "$inst" ] && [ -n "${APPLE_ID:-}" ] && [ -n "${APPLE_TEAM_ID:-}" ]; then
            xcrun notarytool submit "$out" --apple-id "$APPLE_ID" --password "$APPLE_PASSWORD" --team-id "$APPLE_TEAM_ID" --wait
            xcrun stapler staple "$out"
            notarized=1
          fi
          # Gatekeeper's verdict for the package as a browser would leave it (fatal once notarized).
          xattr -w com.apple.quarantine "0081;$(printf %x $(date +%s));Safari;" "$out"
          echo "Gatekeeper verdict for the downloaded .pkg:"
          if [ -n "$notarized" ]; then spctl -a -vv -t install "$out"; else spctl -a -vv -t install "$out" 2>&1 || true; fi
          xattr -d com.apple.quarantine "$out"
          # Prove it installs and the installed app is intact and not flagged.
          sudo installer -pkg "$out" -target /
          codesign --verify --deep --strict --verbose=2 "/Applications/Toolbay.app"
          if xattr -p com.apple.quarantine "/Applications/Toolbay.app" 2>/dev/null; then echo "installed app is quarantined"; exit 1; fi
          echo "Installed app is clean."
          # Also under a fixed name, so releases/latest/download/Toolbay_<arch>.pkg never changes.
          cp "$out" "Toolbay_${arch}.pkg"
          gh release upload "$GITHUB_REF_NAME" "$out" "Toolbay_${arch}.pkg" --clobber

      - name: Windows installer under a fixed name
        if: matrix.platform == 'windows-latest' && github.ref_type == 'tag'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          exe=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -1)
          cp "$exe" Toolbay_x64-setup.exe
          gh release upload "$GITHUB_REF_NAME" Toolbay_x64-setup.exe --clobber
